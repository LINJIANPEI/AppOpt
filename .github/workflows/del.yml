name: 清理历史记录
on:
  workflow_dispatch:
    inputs:
      delete_runs:
        description: "删除 Actions 运行历史"
        required: false
        default: true
        type: boolean
      delete_releases:
        description: "删除 Releases 和 Tags"
        required: false
        default: true
        type: boolean
      keep_recent:
        description: "保留最近的数量（0=全部删除）"
        required: false
        default: "0"
        type: string

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    name: 清理历史和发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Git 用户信息
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 删除 Actions 运行历史
        if: github.event.inputs.delete_runs == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== 开始删除 Actions 运行历史 ==="

          KEEP_RECENT="${{ github.event.inputs.keep_recent }}"
          if [ -z "${KEEP_RECENT}" ] || [ "${KEEP_RECENT}" == "0" ]; then
            KEEP_RECENT=0
          fi

          echo "保留最近 ${KEEP_RECENT} 条记录"

          # 获取所有运行记录
          RUNS=$(gh run list --limit 1000 --json databaseId,status,conclusion,createdAt 2>/dev/null)

          if [ -z "${RUNS}" ]; then
            echo "✅ 没有运行记录需要删除"
            exit 0
          fi

          TOTAL_RUNS=$(echo "${RUNS}" | jq '. | length' 2>/dev/null || echo "0")
          if [ "${TOTAL_RUNS}" -eq 0 ]; then
            echo "✅ 没有运行记录需要删除"
            exit 0
          fi

          echo "总共找到 ${TOTAL_RUNS} 条运行记录"

          # 如果要保留最近 N 条，跳过前 N 条
          SKIP_COUNT=${KEEP_RECENT}
          if [ "${SKIP_COUNT}" -gt 0 ] && [ "${SKIP_COUNT}" -lt "${TOTAL_RUNS}" ]; then
            echo "跳过最近 ${SKIP_COUNT} 条记录"
            RUNS_TO_DELETE=$(echo "${RUNS}" | jq -r ".[${SKIP_COUNT}:] | .[].databaseId" 2>/dev/null)
          else
            RUNS_TO_DELETE=$(echo "${RUNS}" | jq -r ".[].databaseId" 2>/dev/null)
          fi

          if [ -z "${RUNS_TO_DELETE}" ]; then
            echo "✅ 没有运行记录需要删除"
            exit 0
          fi

          DELETED=0
          for RUN_ID in ${RUNS_TO_DELETE}; do
            echo "删除运行记录: ${RUN_ID}"
            if gh run delete "${RUN_ID}" --yes 2>/dev/null; then
              DELETED=$((DELETED + 1))
              echo "✅ 已删除: ${RUN_ID}"
            else
              echo "⚠️ 删除失败: ${RUN_ID}"
            fi
          done

          echo "=== 完成 ==="
          echo "✅ 共删除 ${DELETED} 条运行记录"

      - name: 删除 Releases 和 Tags
        if: github.event.inputs.delete_releases == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== 开始删除 Releases 和 Tags ==="

          # 获取所有 Releases
          RELEASES=$(gh release list --limit 1000 --json tagName,name,isLatest 2>/dev/null)
          if [ -z "${RELEASES}" ]; then
            echo "✅ 没有 Release 需要删除"
            exit 0
          fi

          TOTAL_RELEASES=$(echo "${RELEASES}" | jq '. | length' 2>/dev/null || echo "0")
          if [ "${TOTAL_RELEASES}" -eq 0 ]; then
            echo "✅ 没有 Release 需要删除"
            exit 0
          fi

          echo "总共找到 ${TOTAL_RELEASES} 个 Release"

          DELETED=0
          for RELEASE in $(echo "${RELEASES}" | jq -r '.[] | @base64' 2>/dev/null); do
            _jq() {
              echo "${RELEASE}" | base64 --decode 2>/dev/null | jq -r "${1}" 2>/dev/null
            }
            
            TAG_NAME=$(_jq '.tagName')
            IS_LATEST=$(_jq '.isLatest')
            
            if [ -z "${TAG_NAME}" ] || [ "${TAG_NAME}" == "null" ]; then
              continue
            fi
            
            # 跳过最新的 Release（GitHub 要求至少保留一个）
            if [ "${IS_LATEST}" == "true" ]; then
              echo "⚠️ 跳过最新的 Release: ${TAG_NAME}"
              continue
            fi
            
            echo "删除 Release: ${TAG_NAME}"
            
            # 删除 Release
            if gh release delete "${TAG_NAME}" --yes 2>/dev/null; then
              echo "✅ 已删除 Release: ${TAG_NAME}"
              DELETED=$((DELETED + 1))
            else
              echo "⚠️ 删除 Release 失败: ${TAG_NAME}"
            fi
            
            # 删除对应的 Tag
            if git ls-remote --tags origin | grep -q "refs/tags/${TAG_NAME}$"; then
              echo "删除 Tag: ${TAG_NAME}"
              git push origin --delete "${TAG_NAME}" 2>/dev/null || true
              echo "✅ 已删除 Tag: ${TAG_NAME}"
            fi
          done

          echo "=== 完成 ==="
          echo "✅ 共删除 ${DELETED} 个 Release"

      - name: 清理本地 Tags
        if: github.event.inputs.delete_releases == 'true'
        run: |
          echo "=== 清理本地 Tags ==="
          LOCAL_TAGS=$(git tag -l 2>/dev/null)
          if [ -z "${LOCAL_TAGS}" ]; then
            echo "✅ 没有本地 Tag 需要清理"
            exit 0
          fi
          git tag -d ${LOCAL_TAGS} 2>/dev/null || true
          echo "✅ 本地 Tags 已清理"

      - name: 完成
        run: |
          echo "=== 🎉 清理完成 ==="
          echo ""
          echo "已删除:"
          echo "  - Actions 运行历史: ${{ github.event.inputs.delete_runs }}"
          echo "  - Releases 和 Tags: ${{ github.event.inputs.delete_releases }}"
          echo "  - 保留最近: ${{ github.event.inputs.keep_recent }} 条"
