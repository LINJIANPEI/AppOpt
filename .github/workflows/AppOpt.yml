name: Build AppOpts
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "是否为预发布版本"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-arm64:
    name: Build for arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross compiler
        run: sudo apt update && sudo apt install -y gcc-aarch64-linux-gnu

      - name: Fix missing headers
        run: |
          printf '#include <stdarg.h>\n#include <signal.h>\n' > /tmp/headers.txt
          cat /tmp/headers.txt AppOpt.c > AppOpt.tmp
          mv AppOpt.tmp AppOpt.c

      - name: Build
        run: aarch64-linux-gnu-gcc -static -O2 -pthread -D_GNU_SOURCE -o AppOpt-arm64-v8a AppOpt.c

      - uses: actions/upload-artifact@v4
        with:
          name: AppOpt-arm64-v8a
          path: AppOpt-arm64-v8a

  build-armv7:
    name: Build for armeabi-v7a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross compiler
        run: sudo apt update && sudo apt install -y gcc-arm-linux-gnueabihf

      - name: Fix missing headers
        run: |
          printf '#include <stdarg.h>\n#include <signal.h>\n' > /tmp/headers.txt
          cat /tmp/headers.txt AppOpt.c > AppOpt.tmp
          mv AppOpt.tmp AppOpt.c

      - name: Build
        run: arm-linux-gnueabihf-gcc -static -O2 -pthread -D_GNU_SOURCE -o AppOpt-armeabi-v7a AppOpt.c

      - uses: actions/upload-artifact@v4
        with:
          name: AppOpt-armeabi-v7a
          path: AppOpt-armeabi-v7a

  build-x86:
    name: Build for x86
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross compiler
        run: sudo apt update && sudo apt install -y gcc-i686-linux-gnu

      - name: Fix missing headers
        run: |
          printf '#include <stdarg.h>\n#include <signal.h>\n' > /tmp/headers.txt
          cat /tmp/headers.txt AppOpt.c > AppOpt.tmp
          mv AppOpt.tmp AppOpt.c

      - name: Build
        run: i686-linux-gnu-gcc -static -O2 -pthread -D_GNU_SOURCE -o AppOpt-x86 AppOpt.c

      - uses: actions/upload-artifact@v4
        with:
          name: AppOpt-x86
          path: AppOpt-x86

  build-x86_64:
    name: Build for x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix missing headers
        run: |
          printf '#include <stdarg.h>\n#include <signal.h>\n' > /tmp/headers.txt
          cat /tmp/headers.txt AppOpt.c > AppOpt.tmp
          mv AppOpt.tmp AppOpt.c

      - name: Build
        run: gcc -static -O2 -pthread -D_GNU_SOURCE -o AppOpt-x86_64 AppOpt.c

      - uses: actions/upload-artifact@v4
        with:
          name: AppOpt-x86_64
          path: AppOpt-x86_64

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-arm64, build-armv7, build-x86, build-x86_64]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Copy binaries
        run: |
          mkdir -p release/
          cp artifacts/AppOpt-arm64-v8a/AppOpt-arm64-v8a release/ 2>/dev/null || true
          cp artifacts/AppOpt-armeabi-v7a/AppOpt-armeabi-v7a release/ 2>/dev/null || true
          cp artifacts/AppOpt-x86/AppOpt-x86 release/ 2>/dev/null || true
          cp artifacts/AppOpt-x86_64/AppOpt-x86_64 release/ 2>/dev/null || true
          chmod +x release/*

      - name: Create VERSION.txt
        run: |
          echo "Build Number: ${{ github.run_number }}" > release/VERSION.txt
          echo "Build Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> release/VERSION.txt
          echo "Commit: ${{ github.sha }}" >> release/VERSION.txt
          echo "Triggered by: ${{ github.actor }}" >> release/VERSION.txt

      - name: Create applist.conf.example
        run: |
          echo "# AppOpt 配置文件" > release/applist.conf.example
          echo "# 格式: 进程名{线程名}=CPU核心范围" >> release/applist.conf.example
          echo "" >> release/applist.conf.example
          echo "# 示例规则" >> release/applist.conf.example
          echo "nginx=0-3" >> release/applist.conf.example
          echo "nginx{worker}=0-3" >> release/applist.conf.example
          echo "mysql=4-7" >> release/applist.conf.example
          echo "chrome*=8-11" >> release/applist.conf.example

      - name: Create README.md
        run: |
          echo "# AppOpt - CPU Affinity Optimizer" > release/README.md
          echo "" >> release/README.md
          echo "## 支持架构" >> release/README.md
          echo "| 架构 | 文件名 |" >> release/README.md
          echo "|------|--------|" >> release/README.md
          echo "| arm64-v8a | AppOpt-arm64-v8a |" >> release/README.md
          echo "| armeabi-v7a | AppOpt-armeabi-v7a |" >> release/README.md
          echo "| x86 | AppOpt-x86 |" >> release/README.md
          echo "| x86_64 | AppOpt-x86_64 |" >> release/README.md
          echo "" >> release/README.md
          echo "## 使用方法" >> release/README.md
          echo '```bash' >> release/README.md
          echo "chmod +x AppOpt-x86_64" >> release/README.md
          echo "sudo ./AppOpt-x86_64 -c applist.conf -s 2" >> release/README.md
          echo '```' >> release/README.md

      - name: Create tarball
        run: |
          cd release
          tar -czf ../AppOpt-build-${{ github.run_number }}.tar.gz .
          cd ..
          ls -lh AppOpt-build-*.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: "AppOpt CLEAN Build ${{ github.run_number }}"
          body: |
            AppOpt CLEAN Build ${{ github.run_number }}

            构建信息:
            - 构建编号: #${{ github.run_number }}
            - 构建时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
            - 提交哈希: ${{ github.sha }}
            - 触发者: ${{ github.actor }}

            包含架构:
            - arm64-v8a (64位 ARM)
            - armeabi-v7a (32位 ARM)
            - x86 (32位 x86)
            - x86_64 (64位 x86)

            快速开始:
            tar -xzf AppOpt-build-${{ github.run_number }}.tar.gz
            sudo ./AppOpt-x86_64 -c applist.conf -s 2
          files: |
            AppOpt-build-${{ github.run_number }}.tar.gz
            release/AppOpt-arm64-v8a
            release/AppOpt-armeabi-v7a
            release/AppOpt-x86
            release/AppOpt-x86_64
            release/applist.conf.example
            release/README.md
            release/VERSION.txt
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
