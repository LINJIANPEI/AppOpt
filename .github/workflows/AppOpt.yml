name: 构建 AppOpt

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "是否为预发布版本"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  build-arm64:
    name: 构建 arm64-v8a 版本
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装交叉编译工具链
        run: sudo apt update && sudo apt install -y gcc-aarch64-linux-gnu

      - name: 修复缺失的头文件
        run: |
          printf '#include <stdarg.h>\n#include <signal.h>\n' > /tmp/headers.txt
          cat /tmp/headers.txt AppOpt.c > AppOpt.tmp
          mv AppOpt.tmp AppOpt.c

      - name: 编译（使用本地 uthash）
        run: aarch64-linux-gnu-gcc -static -O2 -pthread -D_GNU_SOURCE -I. -o AppOpt-arm64-v8a AppOpt.c

      - name: 验证编译产物
        run: |
          ls -la AppOpt-arm64-v8a
          file AppOpt-arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: AppOpt-arm64-v8a
          path: AppOpt-arm64-v8a
          if-no-files-found: error

  build-armv7:
    name: 构建 armeabi-v7a 版本
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装交叉编译工具链
        run: sudo apt update && sudo apt install -y gcc-arm-linux-gnueabihf

      - name: 修复缺失的头文件
        run: |
          printf '#include <stdarg.h>\n#include <signal.h>\n' > /tmp/headers.txt
          cat /tmp/headers.txt AppOpt.c > AppOpt.tmp
          mv AppOpt.tmp AppOpt.c

      - name: 编译（使用本地 uthash）
        run: arm-linux-gnueabihf-gcc -static -O2 -pthread -D_GNU_SOURCE -I. -o AppOpt-armeabi-v7a AppOpt.c

      - name: 验证编译产物
        run: |
          ls -la AppOpt-armeabi-v7a
          file AppOpt-armeabi-v7a

      - uses: actions/upload-artifact@v4
        with:
          name: AppOpt-armeabi-v7a
          path: AppOpt-armeabi-v7a
          if-no-files-found: error

  build-x86:
    name: 构建 x86 版本
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装交叉编译工具链
        run: sudo apt update && sudo apt install -y gcc-i686-linux-gnu

      - name: 修复缺失的头文件
        run: |
          printf '#include <stdarg.h>\n#include <signal.h>\n' > /tmp/headers.txt
          cat /tmp/headers.txt AppOpt.c > AppOpt.tmp
          mv AppOpt.tmp AppOpt.c

      - name: 编译（使用本地 uthash）
        run: i686-linux-gnu-gcc -static -O2 -pthread -D_GNU_SOURCE -I. -o AppOpt-x86 AppOpt.c

      - name: 验证编译产物
        run: |
          ls -la AppOpt-x86
          file AppOpt-x86

      - uses: actions/upload-artifact@v4
        with:
          name: AppOpt-x86
          path: AppOpt-x86
          if-no-files-found: error

  build-x86_64:
    name: 构建 x86_64 版本
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 修复缺失的头文件
        run: |
          printf '#include <stdarg.h>\n#include <signal.h>\n' > /tmp/headers.txt
          cat /tmp/headers.txt AppOpt.c > AppOpt.tmp
          mv AppOpt.tmp AppOpt.c

      - name: 编译（使用本地 uthash）
        run: gcc -static -O2 -pthread -D_GNU_SOURCE -I. -o AppOpt-x86_64 AppOpt.c

      - name: 验证编译产物
        run: |
          ls -la AppOpt-x86_64
          file AppOpt-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: AppOpt-x86_64
          path: AppOpt-x86_64
          if-no-files-found: error

  create-release:
    name: 创建发布版本
    runs-on: ubuntu-latest
    needs: [build-arm64, build-armv7, build-x86, build-x86_64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: 生成版本标签
        id: version
        run: |
          TIMESTAMP=$(date -u '+%Y%m%d-%H%M%S')
          if [ "${{ github.event.inputs.prerelease }}" == "true" ]; then
            TAG_NAME="pre-${TIMESTAMP}"
          else
            TAG_NAME="build-${TIMESTAMP}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "版本标签: ${TAG_NAME}"

      - name: 检查下载的产物
        run: |
          echo "=== 检查 artifacts 目录 ==="
          ls -laR artifacts/
          echo ""
          echo "=== 检查是否有二进制文件 ==="
          find artifacts/ -name "AppOpt-*" -exec ls -la {} \;

      - name: 准备发布文件
        run: |
          mkdir -p release/
          
          # 复制二进制文件
          cp artifacts/AppOpt-arm64-v8a/AppOpt-arm64-v8a release/AppOpt-android-arm64 2>/dev/null || echo "警告: arm64-v8a 文件不存在"
          cp artifacts/AppOpt-armeabi-v7a/AppOpt-armeabi-v7a release/AppOpt-android-armv7 2>/dev/null || echo "警告: armeabi-v7a 文件不存在"
          cp artifacts/AppOpt-x86/AppOpt-x86 release/AppOpt-linux-x86 2>/dev/null || echo "警告: x86 文件不存在"
          cp artifacts/AppOpt-x86_64/AppOpt-x86_64 release/AppOpt-linux-x86_64 2>/dev/null || echo "警告: x86_64 文件不存在"
          
          # 添加执行权限
          chmod +x release/* 2>/dev/null || true

      - name: 检查 release 目录
        run: |
          echo "=== release 目录内容 ==="
          ls -la release/
          echo ""
          echo "=== 文件类型检查 ==="
          file release/* 2>/dev/null || echo "没有文件"

      - name: 创建版本信息文件
        run: |
          cat > release/VERSION.txt << EOF
          版本: ${{ steps.version.outputs.version_tag }}
          构建编号: ${{ github.run_number }}
          构建时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          提交哈希: ${{ github.sha }}
          触发者: ${{ github.actor }}
          仓库: ${{ github.repository }}
          EOF

      - name: 创建配置示例文件
        run: |
          cat > release/applist.conf.example << 'EOF'
          # AppOpt 配置文件
          # 格式: 进程名{线程名}=CPU核心范围
          # 示例: nginx{worker}=0-3
          
          # 进程匹配规则
          # 可以使用通配符 * 和 ?
          # 例如: chrome* 匹配所有以 chrome 开头的进程
          
          # 示例规则
          nginx=0-3
          nginx{worker}=0-3
          mysql=4-7
          chrome*=8-11
          redis-server{*}=0-7
          java*{main}=0-1
          systemd{*}=0-1
          EOF

      - name: 创建说明文档
        run: |
          cat > release/README.md << 'EOF'
          # AppOpt - CPU 亲和性优化工具

          ## 简介
          AppOpt 是一个 Linux 进程 CPU 亲和性优化工具，可以指定特定进程或线程运行在指定的 CPU 核心上。

          ## 支持架构
          | 架构 | 文件名 | 适用场景 |
          |------|--------|----------|
          | arm64-v8a | AppOpt-android-arm64 | Android 64位设备 |
          | armeabi-v7a | AppOpt-android-armv7 | Android 32位设备 |
          | x86 | AppOpt-linux-x86 | 32位 Linux 系统 |
          | x86_64 | AppOpt-linux-x86_64 | 64位 Linux 系统 |

          ## 快速开始

          ### 1. 下载对应架构的二进制文件
          根据你的系统架构选择合适的文件。

          ### 2. 创建配置文件
          ```bash
          cp applist.conf.example applist.conf
          vim applist.conf