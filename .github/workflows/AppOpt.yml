name: 构建 AppOpt
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "是否为预发布版本"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-arm64:
    name: 构建 arm64-v8a 版本
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装交叉编译工具链
        run: sudo apt update && sudo apt install -y gcc-aarch64-linux-gnu

      - name: 修复缺失的头文件
        run: |
          printf '#include <stdarg.h>\n#include <signal.h>\n' > /tmp/headers.txt
          cat /tmp/headers.txt AppOpt.c > AppOpt.tmp
          mv AppOpt.tmp AppOpt.c

      - name: 编译（使用本地 uthash）
        run: aarch64-linux-gnu-gcc -static -O2 -pthread -D_GNU_SOURCE -I. -o AppOpt-arm64-v8a AppOpt.c

      - name: 验证编译产物
        run: |
          ls -la AppOpt-arm64-v8a
          file AppOpt-arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: AppOpt-arm64-v8a
          path: AppOpt-arm64-v8a
          if-no-files-found: error

  build-armv7:
    name: 构建 armeabi-v7a 版本
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装交叉编译工具链
        run: sudo apt update && sudo apt install -y gcc-arm-linux-gnueabihf

      - name: 修复缺失的头文件
        run: |
          printf '#include <stdarg.h>\n#include <signal.h>\n' > /tmp/headers.txt
          cat /tmp/headers.txt AppOpt.c > AppOpt.tmp
          mv AppOpt.tmp AppOpt.c

      - name: 编译（使用本地 uthash）
        run: arm-linux-gnueabihf-gcc -static -O2 -pthread -D_GNU_SOURCE -I. -o AppOpt-armeabi-v7a AppOpt.c

      - name: 验证编译产物
        run: |
          ls -la AppOpt-armeabi-v7a
          file AppOpt-armeabi-v7a

      - uses: actions/upload-artifact@v4
        with:
          name: AppOpt-armeabi-v7a
          path: AppOpt-armeabi-v7a
          if-no-files-found: error

  build-x86:
    name: 构建 x86 版本
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装交叉编译工具链
        run: sudo apt update && sudo apt install -y gcc-i686-linux-gnu

      - name: 修复缺失的头文件
        run: |
          printf '#include <stdarg.h>\n#include <signal.h>\n' > /tmp/headers.txt
          cat /tmp/headers.txt AppOpt.c > AppOpt.tmp
          mv AppOpt.tmp AppOpt.c

      - name: 编译（使用本地 uthash）
        run: i686-linux-gnu-gcc -static -O2 -pthread -D_GNU_SOURCE -I. -o AppOpt-x86 AppOpt.c

      - name: 验证编译产物
        run: |
          ls -la AppOpt-x86
          file AppOpt-x86

      - uses: actions/upload-artifact@v4
        with:
          name: AppOpt-x86
          path: AppOpt-x86
          if-no-files-found: error

  build-x86_64:
    name: 构建 x86_64 版本
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 修复缺失的头文件
        run: |
          printf '#include <stdarg.h>\n#include <signal.h>\n' > /tmp/headers.txt
          cat /tmp/headers.txt AppOpt.c > AppOpt.tmp
          mv AppOpt.tmp AppOpt.c

      - name: 编译（使用本地 uthash）
        run: gcc -static -O2 -pthread -D_GNU_SOURCE -I. -o AppOpt-x86_64 AppOpt.c

      - name: 验证编译产物
        run: |
          ls -la AppOpt-x86_64
          file AppOpt-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: AppOpt-x86_64
          path: AppOpt-x86_64
          if-no-files-found: error

  create-release:
    name: 创建发布版本
    runs-on: ubuntu-latest
    needs: [build-arm64, build-armv7, build-x86, build-x86_64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: 生成版本标签
        id: version
        run: |
          TIMESTAMP=$(date -u '+%Y%m%d-%H%M%S')
          TAG_NAME="build-${TIMESTAMP}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "版本标签: ${TAG_NAME}"

      - name: 检查下载的产物
        run: |
          echo "=== 检查 artifacts 目录 ==="
          ls -laR artifacts/
          echo ""
          echo "=== 检查是否有二进制文件 ==="
          find artifacts/ -name "AppOpt-*" -exec ls -la {} \;

      - name: 复制二进制文件
        run: |
          mkdir -p release/
          cp artifacts/AppOpt-arm64-v8a/AppOpt-arm64-v8a release/ 2>/dev/null || true
          cp artifacts/AppOpt-armeabi-v7a/AppOpt-armeabi-v7a release/ 2>/dev/null || true
          cp artifacts/AppOpt-x86/AppOpt-x86 release/ 2>/dev/null || true
          cp artifacts/AppOpt-x86_64/AppOpt-x86_64 release/ 2>/dev/null || true
          chmod +x release/*

      - name: 检查 release 目录
        run: |
          echo "=== release 目录内容 ==="
          ls -la release/

      - name: 创建版本信息文件
        run: |
          echo "版本: ${{ steps.version.outputs.tag_name }}" > release/VERSION.txt
          echo "构建编号: ${{ github.run_number }}" >> release/VERSION.txt
          echo "构建时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> release/VERSION.txt
          echo "提交哈希: ${{ github.sha }}" >> release/VERSION.txt
          echo "触发者: ${{ github.actor }}" >> release/VERSION.txt

      - name: 创建配置示例文件
        run: |
          cat > release/applist.conf.example << 'EOF'
          # AppOpt 配置文件
          # 格式: 进程名{线程名}=CPU核心范围
          # 示例: nginx{worker}=0-3

          # 示例规则
          nginx=0-3
          nginx{worker}=0-3
          mysql=4-7
          chrome*=8-11
          redis-server{*}=0-7
          java*{main}=0-1
          EOF

      - name: 创建说明文档
        run: |
          cat > release/README.md << 'EOF'
          # AppOpt - CPU 亲和性优化工具

          ## 简介
          AppOpt 是一个 Linux 进程 CPU 亲和性优化工具。

          ## 支持架构
          | 架构 | 文件名 |
          |------|--------|
          | arm64-v8a | AppOpt-arm64-v8a |
          | armeabi-v7a | AppOpt-armeabi-v7a |
          | x86 | AppOpt-x86 |
          | x86_64 | AppOpt-x86_64 |

          ## 快速开始
          ```bash
          chmod +x AppOpt-x86_64
          sudo ./AppOpt-x86_64 -c applist.conf -s 2
