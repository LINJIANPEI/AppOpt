name: 构建 AppOpt

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "是否为预发布版本"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  build-arm64:
    name: 构建 arm64-v8a 版本
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装交叉编译工具链
        run: sudo apt update && sudo apt install -y gcc-aarch64-linux-gnu

      - name: 修复缺失的头文件
        run: |
          printf '#include <stdarg.h>\n#include <signal.h>\n' > /tmp/headers.txt
          cat /tmp/headers.txt AppOpt.c > AppOpt.tmp
          mv AppOpt.tmp AppOpt.c

      - name: 编译（使用本地 uthash）
        run: aarch64-linux-gnu-gcc -static -O2 -pthread -D_GNU_SOURCE -I. -o AppOpt-arm64-v8a AppOpt.c

      - name: 验证编译产物
        run: |
          ls -la AppOpt-arm64-v8a
          file AppOpt-arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: AppOpt-arm64-v8a
          path: AppOpt-arm64-v8a
          if-no-files-found: error

  build-armv7:
    name: 构建 armeabi-v7a 版本
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装交叉编译工具链
        run: sudo apt update && sudo apt install -y gcc-arm-linux-gnueabihf

      - name: 修复缺失的头文件
        run: |
          printf '#include <stdarg.h>\n#include <signal.h>\n' > /tmp/headers.txt
          cat /tmp/headers.txt AppOpt.c > AppOpt.tmp
          mv AppOpt.tmp AppOpt.c

      - name: 编译（使用本地 uthash）
        run: arm-linux-gnueabihf-gcc -static -O2 -pthread -D_GNU_SOURCE -I. -o AppOpt-armeabi-v7a AppOpt.c

      - name: 验证编译产物
        run: |
          ls -la AppOpt-armeabi-v7a
          file AppOpt-armeabi-v7a

      - uses: actions/upload-artifact@v4
        with:
          name: AppOpt-armeabi-v7a
          path: AppOpt-armeabi-v7a
          if-no-files-found: error

  build-x86:
    name: 构建 x86 版本
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装交叉编译工具链
        run: sudo apt update && sudo apt install -y gcc-i686-linux-gnu

      - name: 修复缺失的头文件
        run: |
          printf '#include <stdarg.h>\n#include <signal.h>\n' > /tmp/headers.txt
          cat /tmp/headers.txt AppOpt.c > AppOpt.tmp
          mv AppOpt.tmp AppOpt.c

      - name: 编译（使用本地 uthash）
        run: i686-linux-gnu-gcc -static -O2 -pthread -D_GNU_SOURCE -I. -o AppOpt-x86 AppOpt.c

      - name: 验证编译产物
        run: |
          ls -la AppOpt-x86
          file AppOpt-x86

      - uses: actions/upload-artifact@v4
        with:
          name: AppOpt-x86
          path: AppOpt-x86
          if-no-files-found: error

  build-x86_64:
    name: 构建 x86_64 版本
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 修复缺失的头文件
        run: |
          printf '#include <stdarg.h>\n#include <signal.h>\n' > /tmp/headers.txt
          cat /tmp/headers.txt AppOpt.c > AppOpt.tmp
          mv AppOpt.tmp AppOpt.c

      - name: 编译（使用本地 uthash）
        run: gcc -static -O2 -pthread -D_GNU_SOURCE -I. -o AppOpt-x86_64 AppOpt.c

      - name: 验证编译产物
        run: |
          ls -la AppOpt-x86_64
          file AppOpt-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: AppOpt-x86_64
          path: AppOpt-x86_64
          if-no-files-found: error

  create-release:
    name: 创建发布版本
    runs-on: ubuntu-latest
    needs: [build-arm64, build-armv7, build-x86, build-x86_64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: 生成版本标签
        id: version
        run: |
          TIMESTAMP=$(date -u '+%Y%m%d-%H%M%S')
          if [ "${{ github.event.inputs.prerelease }}" == "true" ]; then
            TAG_NAME="pre-${TIMESTAMP}"
          else
            TAG_NAME="build-${TIMESTAMP}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "版本标签: ${TAG_NAME}"

      - name: 检查下载的产物
        run: |
          echo "=== 检查 artifacts 目录 ==="
          ls -laR artifacts/

      - name: 准备发布文件
        run: |
          mkdir -p release/
          cp artifacts/AppOpt-arm64-v8a/AppOpt-arm64-v8a release/AppOpt-android-arm64 2>/dev/null || true
          cp artifacts/AppOpt-armeabi-v7a/AppOpt-armeabi-v7a release/AppOpt-android-armv7 2>/dev/null || true
          cp artifacts/AppOpt-x86/AppOpt-x86 release/AppOpt-linux-x86 2>/dev/null || true
          cp artifacts/AppOpt-x86_64/AppOpt-x86_64 release/AppOpt-linux-x86_64 2>/dev/null || true
          chmod +x release/*

      - name: 检查 release 目录
        run: |
          echo "=== release 目录内容 ==="
          ls -la release/

      - name: 创建版本信息文件
        run: |
          cat > release/VERSION.txt << EOF
          版本: ${{ steps.version.outputs.tag_name }}
          构建编号: ${{ github.run_number }}
          构建时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          提交哈希: ${{ github.sha }}
          触发者: ${{ github.actor }}
          EOF

      - name: 创建配置示例文件
        run: |
          cat > release/applist.conf.example << 'EOF'
          # AppOpt 配置文件
          # 格式: 进程名{线程名}=CPU核心范围

          # 示例规则
          nginx=0-3
          nginx{worker}=0-3
          mysql=4-7
          chrome*=8-11
          redis-server{*}=0-7
          EOF

      - name: 创建说明文档
        run: |
          cat > release/README.md << 'EOF'
          # AppOpt - CPU 亲和性优化工具

          ## 支持架构
          | 架构 | 文件名 |
          |------|--------|
          | arm64-v8a | AppOpt-android-arm64 |
          | armeabi-v7a | AppOpt-android-armv7 |
          | x86 | AppOpt-linux-x86 |
          | x86_64 | AppOpt-linux-x86_64 |

          ## 快速开始
          ```bash
          chmod +x AppOpt-linux-x86_64
          sudo ./AppOpt-linux-x86_64 -c applist.conf -s 2
          ```
          EOF

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "AppOpt ${{ steps.version.outputs.tag_name }}"
          body: |
            ## 🚀 AppOpt 自动构建版本

            ### 构建信息
            - 构建编号: #${{ github.run_number }}
            - 提交哈希: `${{ github.sha }}`
            - 触发者: @${{ github.actor }}
            - 构建时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

            ### 📦 包含的二进制文件
            | 架构 | 文件 |
            |------|------|
            | ARM64 | AppOpt-android-arm64 |
            | ARMv7 | AppOpt-android-armv7 |
            | x86 | AppOpt-linux-x86 |
            | x86_64 | AppOpt-linux-x86_64 |

            ### 📖 使用方法
            ```bash
            chmod +x AppOpt-linux-x86_64
            sudo ./AppOpt-linux-x86_64 -c applist.conf -s 2
            ```
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
          files: |
            release/AppOpt-android-arm64
            release/AppOpt-android-armv7
            release/AppOpt-linux-x86
            release/AppOpt-linux-x86_64
            release/VERSION.txt
            release/applist.conf.example
            release/README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 输出成功信息
        run: |
          echo "✅ Release 创建成功！"
          echo "标签: ${{ steps.version.outputs.tag_name }}"
          echo "查看: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag_name }}"