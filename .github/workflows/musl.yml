name: Build AppOpts

on:
  push:
    branches: [ main, master ]
    paths:
      - 'AppOpts.c'
      - 'uthash.h'
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  # ==================== arm64-v8a (aarch64) ====================
  build-arm64:
    name: Build for arm64-v8a
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify source files
      run: |
        ls -la AppOpts.c uthash.h

    - name: Install cross compiler
      run: |
        sudo apt update
        sudo apt install -y gcc-aarch64-linux-gnu

    - name: Build static binary
      run: |
        echo "=== Building AppOpt-arm64-v8a ==="
        aarch64-linux-gnu-gcc -static \
            -O2 \
            -pthread \
            -Wall -Wextra \
            -D_GNU_SOURCE \
            -o AppOpt-arm64-v8a \
            AppOpts.c
        
        file AppOpt-arm64-v8a
        aarch64-linux-gnu-strip AppOpt-arm64-v8a
        ls -lh AppOpt-arm64-v8a

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AppOpt-arm64-v8a
        path: AppOpt-arm64-v8a
        retention-days: 90

  # ==================== armeabi-v7a (armv7) ====================
  build-armv7:
    name: Build for armeabi-v7a
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify source files
      run: |
        ls -la AppOpts.c uthash.h

    - name: Install cross compiler
      run: |
        sudo apt update
        sudo apt install -y gcc-arm-linux-gnueabihf

    - name: Build static binary
      run: |
        echo "=== Building AppOpt-armeabi-v7a ==="
        arm-linux-gnueabihf-gcc -static \
            -O2 \
            -pthread \
            -Wall -Wextra \
            -D_GNU_SOURCE \
            -o AppOpt-armeabi-v7a \
            AppOpts.c
        
        file AppOpt-armeabi-v7a
        arm-linux-gnueabihf-strip AppOpt-armeabi-v7a
        ls -lh AppOpt-armeabi-v7a

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AppOpt-armeabi-v7a
        path: AppOpt-armeabi-v7a
        retention-days: 90

  # ==================== x86 ====================
  build-x86:
    name: Build for x86
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify source files
      run: |
        ls -la AppOpts.c uthash.h

    - name: Install cross compiler
      run: |
        sudo apt update
        sudo apt install -y gcc-i686-linux-gnu

    - name: Build static binary
      run: |
        echo "=== Building AppOpt-x86 ==="
        i686-linux-gnu-gcc -static \
            -O2 \
            -pthread \
            -Wall -Wextra \
            -D_GNU_SOURCE \
            -o AppOpt-x86 \
            AppOpts.c \
            -m32
        
        file AppOpt-x86
        i686-linux-gnu-strip AppOpt-x86
        ls -lh AppOpt-x86

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AppOpt-x86
        path: AppOpt-x86
        retention-days: 90

  # ==================== x86_64 ====================
  build-x86_64:
    name: Build for x86_64
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify source files
      run: |
        ls -la AppOpts.c uthash.h

    - name: Build static binary
      run: |
        echo "=== Building AppOpt-x86_64 ==="
        gcc -static \
            -O2 \
            -pthread \
            -Wall -Wextra \
            -D_GNU_SOURCE \
            -o AppOpt-x86_64 \
            AppOpts.c
        
        file AppOpt-x86_64
        strip AppOpt-x86_64
        ls -lh AppOpt-x86_64

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AppOpt-x86_64
        path: AppOpt-x86_64
        retention-days: 90

  # ==================== 发布阶段 ====================
  release:
    name: Create Release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [build-arm64, build-armv7, build-x86, build-x86_64]
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: List artifacts
      run: |
        echo "=== Downloaded artifacts ==="
        find artifacts/ -type f | sort

    - name: Package release
      run: |
        mkdir -p release/
        
        # 复制所有二进制文件
        cp artifacts/AppOpt-arm64-v8a/AppOpt-arm64-v8a release/ 2>/dev/null || true
        cp artifacts/AppOpt-armeabi-v7a/AppOpt-armeabi-v7a release/ 2>/dev/null || true
        cp artifacts/AppOpt-x86/AppOpt-x86 release/ 2>/dev/null || true
        cp artifacts/AppOpt-x86_64/AppOpt-x86_64 release/ 2>/dev/null || true
        
        # 设置执行权限
        chmod +x release/*
        
        # 添加配置文件示例
        cat > release/applist.conf.example << 'EOF'
        # AppOpt 配置文件
        # 格式: 进程名{线程名}=CPU核心
        
        # 示例规则
        nginx=0-3
        nginx{worker}=0-3
        mysql=4-7
        chrome*=8-11
        
        # CPU范围格式: 0,2,4 或 0-3 或 0-3,8,10-12
        EOF
        
        # 添加 README
        cat > release/README.md << 'EOF'
        # AppOpt - CPU Affinity Optimizer
        
        ## 支持架构
        - arm64-v8a (64位 ARM)
        - armeabi-v7a (32位 ARM)
        - x86 (32位 x86)
        - x86_64 (64位 x86)
        
        ## 使用方法
        ```bash
        # 赋予执行权限
        chmod +x AppOpt-*
        
        # 运行 (需要 root 权限)
        sudo ./AppOpt-arm64-v8a -c /path/to/applist.conf -s 2
        
        # 查看帮助
        ./AppOpt-arm64-v8a -h
