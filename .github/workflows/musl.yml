name: Build AppOpts

on:
  workflow_dispatch:        # 仅手动触发
    inputs:
      version:
        description: '版本号 (必填，如: v1.0.0)'
        required: true
        default: ''
        type: string
      prerelease:
        description: '是否为预发布版本'
        required: false
        default: true
        type: boolean

jobs:
  # ==================== arm64-v8a ====================
  build-arm64:
    name: Build for arm64-v8a
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install cross compiler
      run: |
        sudo apt update
        sudo apt install -y gcc-aarch64-linux-gnu

    - name: Fix missing headers
      run: |
        sed -i '/#include "uthash.h"/i #include <stdarg.h>\n#include <signal.h>' AppOpts.c

    - name: Build static binary
      run: |
        echo "=== Building AppOpt-arm64-v8a ==="
        aarch64-linux-gnu-gcc -static \
            -O2 \
            -pthread \
            -Wall -Wextra \
            -D_GNU_SOURCE \
            -o AppOpt-arm64-v8a \
            AppOpts.c
        
        file AppOpt-arm64-v8a
        aarch64-linux-gnu-strip AppOpt-arm64-v8a
        ls -lh AppOpt-arm64-v8a

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AppOpt-arm64-v8a
        path: AppOpt-arm64-v8a
        retention-days: 90

  # ==================== armeabi-v7a ====================
  build-armv7:
    name: Build for armeabi-v7a
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install cross compiler
      run: |
        sudo apt update
        sudo apt install -y gcc-arm-linux-gnueabihf

    - name: Fix missing headers
      run: |
        sed -i '/#include "uthash.h"/i #include <stdarg.h>\n#include <signal.h>' AppOpts.c

    - name: Build static binary
      run: |
        echo "=== Building AppOpt-armeabi-v7a ==="
        arm-linux-gnueabihf-gcc -static \
            -O2 \
            -pthread \
            -Wall -Wextra \
            -D_GNU_SOURCE \
            -o AppOpt-armeabi-v7a \
            AppOpts.c
        
        file AppOpt-armeabi-v7a
        arm-linux-gnueabihf-strip AppOpt-armeabi-v7a
        ls -lh AppOpt-armeabi-v7a

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AppOpt-armeabi-v7a
        path: AppOpt-armeabi-v7a
        retention-days: 90

  # ==================== x86 ====================
  build-x86:
    name: Build for x86
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install cross compiler
      run: |
        sudo apt update
        sudo apt install -y gcc-i686-linux-gnu

    - name: Fix missing headers
      run: |
        sed -i '/#include "uthash.h"/i #include <stdarg.h>\n#include <signal.h>' AppOpts.c

    - name: Build static binary
      run: |
        echo "=== Building AppOpt-x86 ==="
        i686-linux-gnu-gcc -static \
            -O2 \
            -pthread \
            -Wall -Wextra \
            -D_GNU_SOURCE \
            -o AppOpt-x86 \
            AppOpts.c
        
        file AppOpt-x86
        i686-linux-gnu-strip AppOpt-x86
        ls -lh AppOpt-x86

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AppOpt-x86
        path: AppOpt-x86
        retention-days: 90

  # ==================== x86_64 ====================
  build-x86_64:
    name: Build for x86_64
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix missing headers
      run: |
        sed -i '/#include "uthash.h"/i #include <stdarg.h>\n#include <signal.h>' AppOpts.c

    - name: Build static binary
      run: |
        echo "=== Building AppOpt-x86_64 ==="
        gcc -static \
            -O2 \
            -pthread \
            -Wall -Wextra \
            -D_GNU_SOURCE \
            -o AppOpt-x86_64 \
            AppOpts.c
        
        file AppOpt-x86_64
        strip AppOpt-x86_64
        ls -lh AppOpt-x86_64

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AppOpt-x86_64
        path: AppOpt-x86_64
        retention-days: 90

  # ==================== 创建 Release ====================
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-arm64, build-armv7, build-x86, build-x86_64]
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: Organize release files
      run: |
        mkdir -p release/
        
        # 复制所有二进制文件
        cp artifacts/AppOpt-arm64-v8a/AppOpt-arm64-v8a release/
        cp artifacts/AppOpt-armeabi-v7a/AppOpt-armeabi-v7a release/
        cp artifacts/AppOpt-x86/AppOpt-x86 release/
        cp artifacts/AppOpt-x86_64/AppOpt-x86_64 release/
        
        chmod +x release/*
        
        # 创建版本信息
        VERSION="${{ github.event.inputs.version }}"
        echo "Version: $VERSION" > release/VERSION.txt
        echo "Build Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> release/VERSION.txt
        echo "Commit: ${{ github.sha }}" >> release/VERSION.txt
        echo "Triggered by: ${{ github.actor }}" >> release/VERSION.txt
        
        # 添加配置文件示例
        cat > release/applist.conf.example << 'EOF'
        # AppOpt 配置文件
        # 格式: 进程名{线程名}=CPU核心范围
        
        # 示例规则
        nginx=0-3
        nginx{worker}=0-3
        mysql=4-7
        chrome*=8-11
        
        # CPU范围格式: 0,2,4 或 0-3 或 0-3,8,10-12
        EOF
        
        # 添加 README
        cat > release/README.md << 'EOF'
        # AppOpt - CPU Affinity Optimizer
        
        ## 支持架构
        | 架构 | 文件名 |
        |------|--------|
        | arm64-v8a (64位 ARM) | AppOpt-arm64-v8a |
        | armeabi-v7a (32位 ARM) | AppOpt-armeabi-v7a |
        | x86 (32位 x86) | AppOpt-x86 |
        | x86_64 (64位 x86) | AppOpt-x86_64 |
        
        ## 使用方法
        
        ### 1. 下载对应架构的二进制文件
        ### 2. 赋予执行权限
        ```bash
        chmod +x AppOpt-x86_64
