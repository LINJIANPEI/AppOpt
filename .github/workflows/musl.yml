name: Build AppOpts

on:
  push:
    branches: [ main, master ]
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build-arm64:
    name: Build for arm64-v8a
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: sudo apt update && sudo apt install -y gcc-aarch64-linux-gnu
    - name: Fix headers
      run: |
        sed -i '/#include "uthash.h"/i #include <stdarg.h>\n#include <signal.h>' AppOpts.c
    - run: aarch64-linux-gnu-gcc -static -O2 -pthread -D_GNU_SOURCE -o AppOpt-arm64-v8a AppOpts.c
    - uses: actions/upload-artifact@v4
      with:
        name: AppOpt-arm64-v8a
        path: AppOpt-arm64-v8a

  build-armv7:
    name: Build for armeabi-v7a
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: sudo apt update && sudo apt install -y gcc-arm-linux-gnueabihf
    - name: Fix headers
      run: |
        sed -i '/#include "uthash.h"/i #include <stdarg.h>\n#include <signal.h>' AppOpts.c
    - run: arm-linux-gnueabihf-gcc -static -O2 -pthread -D_GNU_SOURCE -o AppOpt-armeabi-v7a AppOpts.c
    - uses: actions/upload-artifact@v4
      with:
        name: AppOpt-armeabi-v7a
        path: AppOpt-armeabi-v7a

  build-x86:
    name: Build for x86
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: sudo apt update && sudo apt install -y gcc-i686-linux-gnu
    - name: Fix headers
      run: |
        sed -i '/#include "uthash.h"/i #include <stdarg.h>\n#include <signal.h>' AppOpts.c
    - run: i686-linux-gnu-gcc -static -O2 -pthread -D_GNU_SOURCE -o AppOpt-x86 AppOpts.c
    - uses: actions/upload-artifact@v4
      with:
        name: AppOpt-x86
        path: AppOpt-x86

  build-x86_64:
    name: Build for x86_64
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Fix headers
      run: |
        sed -i '/#include "uthash.h"/i #include <stdarg.h>\n#include <signal.h>' AppOpts.c
    - run: gcc -static -O2 -pthread -D_GNU_SOURCE -o AppOpt-x86_64 AppOpts.c
    - uses: actions/upload-artifact@v4
      with:
        name: AppOpt-x86_64
        path: AppOpt-x86_64

  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [build-arm64, build-armv7, build-x86, build-x86_64]
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts/
    - run: |
        mkdir release/
        cp artifacts/AppOpt-arm64-v8a/AppOpt-arm64-v8a release/ 2>/dev/null || true
        cp artifacts/AppOpt-armeabi-v7a/AppOpt-armeabi-v7a release/ 2>/dev/null || true
        cp artifacts/AppOpt-x86/AppOpt-x86 release/ 2>/dev/null || true
        cp artifacts/AppOpt-x86_64/AppOpt-x86_64 release/ 2>/dev/null || true
        chmod +x release/*
        tar -czf AppOpt-release.tar.gz -C release .
    - uses: softprops/action-gh-release@v1
      with:
        files: AppOpt-release.tar.gz
