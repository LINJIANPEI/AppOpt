name: Build AppOpts

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: '是否为预发布版本'
        required: false
        default: true
        type: boolean

jobs:
  build-arm64:
    name: Build for arm64-v8a
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: sudo apt update && sudo apt install -y gcc-aarch64-linux-gnu
    - run: sed -i '/#include "uthash.h"/i #include <stdarg.h>\n#include <signal.h>' AppOpts.c
    - run: aarch64-linux-gnu-gcc -static -O2 -pthread -D_GNU_SOURCE -o AppOpt-arm64-v8a AppOpts.c
    - uses: actions/upload-artifact@v4
      with:
        name: AppOpt-arm64-v8a
        path: AppOpt-arm64-v8a

  build-armv7:
    name: Build for armeabi-v7a
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: sudo apt update && sudo apt install -y gcc-arm-linux-gnueabihf
    - run: sed -i '/#include "uthash.h"/i #include <stdarg.h>\n#include <signal.h>' AppOpts.c
    - run: arm-linux-gnueabihf-gcc -static -O2 -pthread -D_GNU_SOURCE -o AppOpt-armeabi-v7a AppOpts.c
    - uses: actions/upload-artifact@v4
      with:
        name: AppOpt-armeabi-v7a
        path: AppOpt-armeabi-v7a

  build-x86:
    name: Build for x86
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: sudo apt update && sudo apt install -y gcc-i686-linux-gnu
    - run: sed -i '/#include "uthash.h"/i #include <stdarg.h>\n#include <signal.h>' AppOpts.c
    - run: i686-linux-gnu-gcc -static -O2 -pthread -D_GNU_SOURCE -o AppOpt-x86 AppOpts.c
    - uses: actions/upload-artifact@v4
      with:
        name: AppOpt-x86
        path: AppOpt-x86

  build-x86_64:
    name: Build for x86_64
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: sed -i '/#include "uthash.h"/i #include <stdarg.h>\n#include <signal.h>' AppOpts.c
    - run: gcc -static -O2 -pthread -D_GNU_SOURCE -o AppOpt-x86_64 AppOpts.c
    - uses: actions/upload-artifact@v4
      with:
        name: AppOpt-x86_64
        path: AppOpt-x86_64

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-arm64, build-armv7, build-x86, build-x86_64]
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: Organize release files
      run: |
        mkdir -p release/
        cp artifacts/AppOpt-arm64-v8a/AppOpt-arm64-v8a release/
        cp artifacts/AppOpt-armeabi-v7a/AppOpt-armeabi-v7a release/
        cp artifacts/AppOpt-x86/AppOpt-x86 release/
        cp artifacts/AppOpt-x86_64/AppOpt-x86_64 release/
        chmod +x release/*

        RUN_NUM="${{ github.run_number }}"
        echo "Build Number: $RUN_NUM" > release/VERSION.txt
        echo "Build Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> release/VERSION.txt
        echo "Commit: ${{ github.sha }}" >> release/VERSION.txt
        echo "Triggered by: ${{ github.actor }}" >> release/VERSION.txt

        cat > release/applist.conf.example << 'EOF'
# AppOpt 配置文件
# 格式: 进程名{线程名}=CPU核心范围

# 示例规则
nginx=0-3
nginx{worker}=0-3
mysql=4-7
chrome*=8-11

# CPU范围格式: 0,2,4 或 0-3 或 0-3,8,10-12
EOF

        cat > release/README.md << 'EOF'
# AppOpt - CPU Affinity Optimizer

## 支持架构
| 架构 | 文件名 |
|------|--------|
| arm64-v8a (64位 ARM) | AppOpt-arm64-v8a |
| armeabi-v7a (32位 ARM) | AppOpt-armeabi-v7a |
| x86 (32位 x86) | AppOpt-x86 |
| x86_64 (64位 x86) | AppOpt-x86_64 |

## 使用方法

chmod +x AppOpt-x86_64
sudo ./AppOpt-x86_64 -c applist.conf -s 2

## 验证静态编译
file AppOpt-x86_64
EOF

        cd release
        tar -czf ../AppOpt-build-${{ github.run_number }}.tar.gz .
        cd ..
        ls -lh AppOpt-build-*.tar.gz

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.run_number }}
        name: "AppOpt CLEAN Build ${{ github.run_number }}"
        body: |
          ## AppOpt CLEAN Build ${{ github.run_number }}

          ### 构建信息
          | 项目 | 信息 |
          |------|------|
          | 构建编号 | #${{ github.run_number }} |
          | 构建时间 | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |
          | 提交哈希 | `${{ github.sha }}` |
          | 触发者 | @${{ github.actor }} |

          ### 包含文件
          - AppOpt-arm64-v8a - 64位 ARM
          - AppOpt-armeabi-v7a - 32位 ARM
          - AppOpt-x86 - 32位 x86
          - AppOpt-x86_64 - 64位 x86

          ### 快速开始
          ```bash
          tar -xzf AppOpt-build-${{ github.run_number }}.tar.gz
          sudo ./AppOpt-x86_64 -c applist.conf -s 2
