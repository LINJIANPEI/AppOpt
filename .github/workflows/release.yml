name: 构建 AppOpt Rust

on:
  push:
    paths:
      - "AppOpt/**"
      - "AppOpt-ebpf/**"
  workflow_dispatch: # 手动触发时默认全部重新编译

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      ebpf: ${{ steps.filter.outputs.ebpf }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            app:
              - 'AppOpt/**'
            ebpf:
              - 'AppOpt-ebpf/**'

  check-release:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: 查看最新 Release
        id: check
        run: |
          if gh release list --limit 1 --order desc --json tagName | jq -e '. | length > 0' >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-app:
    needs: [changes, check-release]
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.app == 'true' ||
      needs.check-release.outputs.exists == 'false'    # 👈 加回这行
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AppOpt
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: 配置 linker
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
          EOF
      - uses: Swatinem/rust-cache@v2
      - name: 编译
        run: cargo build --release --target aarch64-linux-android
      - name: 上传新编译的 AppOpt
        uses: actions/upload-artifact@v4
        with:
          name: AppOpt-new
          path: AppOpt/target/aarch64-linux-android/release/AppOpt

  build-ebpf:
    needs: [changes, check-release]
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.ebpf == 'true' ||
      needs.check-release.outputs.exists == 'false'    # 👈 加回这行
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AppOpt-ebpf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: 安装 bpf-linker
        run: |
          cargo install cargo-binstall
          cargo binstall bpf-linker --no-symlinks
      - name: 配置 linker
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<EOF
          [target.bpfel-unknown-none]
          linker = "bpf-linker"
          EOF
      - name: 编译
        env:
          RUSTFLAGS: "-C link-arg=-O2"
        run: cargo build --release --target bpfel-unknown-none -Z build-std=core
      - name: 上传新编译的 eBPF
        uses: actions/upload-artifact@v4
        with:
          name: AppOpt-ebpf-new
          path: AppOpt-ebpf/target/bpfel-unknown-none/release/AppOpt-ebpf

  create-release:
    runs-on: ubuntu-latest
    needs: [changes, build-app, build-ebpf]
    if: always() && (needs.build-app.result == 'success' || needs.build-ebpf.result == 'success' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/new/
        continue-on-error: true

      - name: 准备目录
        run: mkdir -p release/package/AppOpt-aarch64

      - name: 获取最新 Release 标签
        id: latest
        run: |
          TAG=$(gh release list --limit 1 --order desc --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 获取 AppOpt 二进制
        run: |
          if [ -f artifacts/new/AppOpt-new/AppOpt ]; then
            cp artifacts/new/AppOpt-new/AppOpt release/package/AppOpt-aarch64/AppOpt
            echo "使用新编译的 AppOpt"
          elif [ -n "${{ steps.latest.outputs.tag }}" ]; then
            echo "从 Release ${{ steps.latest.outputs.tag }} 下载 AppOpt"
            gh release download ${{ steps.latest.outputs.tag }} -p "AppOpt" -D release/package/AppOpt-aarch64/
          else
            echo "❌ 错误：没有 AppOpt 二进制可用（既无新编译也无旧 Release）"
            exit 1
          fi
          chmod +x release/package/AppOpt-aarch64/AppOpt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 获取 eBPF 二进制
        run: |
          if [ -f artifacts/new/AppOpt-ebpf-new/AppOpt-ebpf ]; then
            cp artifacts/new/AppOpt-ebpf-new/AppOpt-ebpf release/package/AppOpt-aarch64/AppOpt-ebpf
            echo "使用新编译的 eBPF"
          elif [ -n "${{ steps.latest.outputs.tag }}" ]; then
            echo "从 Release ${{ steps.latest.outputs.tag }} 下载 eBPF"
            gh release download ${{ steps.latest.outputs.tag }} -p "AppOpt-ebpf" -D release/package/AppOpt-aarch64/
          else
            echo "❌ 错误：没有 eBPF 二进制可用（既无新编译也无旧 Release）"
            exit 1
          fi
          chmod +x release/package/AppOpt-aarch64/AppOpt-ebpf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 打包
        run: |
          tar -czvf release/AppOpt-aarch64.tar.gz -C release/package AppOpt-aarch64
          cp release/package/AppOpt-aarch64/* release/

      - name: 生成版本标签
        id: version
        run: |
          TAG="build-$(date -u '+%Y%m%d-%H%M%S')"
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "AppOpt ${{ steps.version.outputs.tag_name }}"
          body: |
            ## 自动构建版本（增量更新）
            - AppOpt: ${{ needs.changes.outputs.app == 'true' && '🆕 新编译' || '📦 复用旧版' }}
            - eBPF: ${{ needs.changes.outputs.ebpf == 'true' && '🆕 新编译' || '📦 复用旧版' }}
          files: |
            release/AppOpt
            release/AppOpt-ebpf
            release/AppOpt-aarch64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
