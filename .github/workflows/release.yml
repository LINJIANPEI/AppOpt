name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-app:
    name: Build AppOpt
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: AppOpt

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build AppOpt
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: AppOpt
          path: AppOpt/target/release/AppOpt

  build-ebpf:
    name: Build AppOpt-ebpf
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: AppOpt-ebpf

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2

      - name: Install bpf-linker
        run: cargo install bpf-linker

      - name: Configure Cargo
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<EOF
          [target.bpfel-unknown-none]
          linker = "bpf-linker"
          EOF

      - name: Build AppOpt-ebpf
        run: |
          cargo build \
            --release \
            --target bpfel-unknown-none \
            -Z build-std=core

      - uses: actions/upload-artifact@v4
        with:
          name: AppOpt-ebpf
          path: AppOpt-ebpf/target/bpfel-unknown-none/release/AppOpt-ebpf