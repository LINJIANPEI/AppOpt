name: 构建 AppOpt rust

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-app:
    name: 构建 AppOpt ARM64 Android
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: AppOpt

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装 Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: 安装 Rust ARM64 Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 配置 Android linker
        run: |
          mkdir -p ~/.cargo

          cat > ~/.cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
          EOF

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2

      - name: 编译 AppOpt
        run: |
          cargo build \
            --release \
            --target aarch64-linux-android

      - name: 验证 AppOpt
        run: |
          ls -lh target/aarch64-linux-android/release/AppOpt
          file target/aarch64-linux-android/release/AppOpt

      - name: 上传 AppOpt
        uses: actions/upload-artifact@v4
        with:
          name: AppOpt
          path: AppOpt/target/aarch64-linux-android/release/AppOpt
          if-no-files-found: error

  build-ebpf:
    name: 构建 AppOpt eBPF 程序
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: AppOpt-ebpf

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装 Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2

      - name: 安装 bpf-linker
        run: cargo install bpf-linker

      - name: 安装 bpf-linker（预编译） # 👈 新增步骤，替换原来的两个安装步骤
        run: |
          cargo install cargo-binstall
          cargo binstall bpf-linker --no-symlinks

      - name: 配置 eBPF linker
        run: |
          mkdir -p ~/.cargo

          cat > ~/.cargo/config.toml <<EOF
          [target.bpfel-unknown-none]
          linker = "bpf-linker"
          EOF

      - name: 编译 AppOpt-ebpf
        run: |
          cargo build \
            --release \
            --target bpfel-unknown-none \
            -Z build-std=core

      - name: 验证 eBPF
        run: |
          ls -lh target/bpfel-unknown-none/release/AppOpt-ebpf
          file target/bpfel-unknown-none/release/AppOpt-ebpf

      - name: 上传 eBPF
        uses: actions/upload-artifact@v4
        with:
          name: AppOpt-ebpf
          path: AppOpt-ebpf/target/bpfel-unknown-none/release/AppOpt-ebpf
          if-no-files-found: error

  create-release:
    name: 创建发布版本
    runs-on: ubuntu-latest

    needs:
      - build-app
      - build-ebpf

    steps:
      - name: 下载编译产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: 生成版本标签
        id: version
        run: |
          TAG="build-$(date -u '+%Y%m%d-%H%M%S')"
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT

      - name: 检查产物
        run: |
          ls -lhR artifacts/

      - name: 准备发布文件
        run: |
          mkdir -p release

          cp artifacts/AppOpt/AppOpt \
             release/AppOpt

          cp artifacts/AppOpt-ebpf/AppOpt-ebpf \
             release/AppOpt-ebpf


          mkdir -p release/package/AppOpt-aarch64

          cp release/AppOpt \
             release/package/AppOpt-aarch64/AppOpt

          cp release/AppOpt-ebpf \
             release/package/AppOpt-aarch64/AppOpt-ebpf


          chmod +x release/*
          chmod +x release/package/AppOpt-aarch64/*


          tar -czvf \
            release/AppOpt-aarch64.tar.gz \
            -C release/package \
            AppOpt-aarch64


          ls -lh release/

      - name: 创建版本信息
        run: |
          cat > release/VERSION.txt <<EOF
          项目: AppOpt
          版本: ${{ steps.version.outputs.tag_name }}
          构建编号: ${{ github.run_number }}
          提交: ${{ github.sha }}
          时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          EOF

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2

        with:
          tag_name: ${{ steps.version.outputs.tag_name }}

          name: "AppOpt ${{ steps.version.outputs.tag_name }}"

          body: |
            ## 🚀 AppOpt 自动构建版本

            ### 文件

            - AppOpt Android ARM64
            - AppOpt eBPF

            ### 压缩包

            ```
            AppOpt-aarch64/
            ├── AppOpt
            └── AppOpt-ebpf
            ```

            ### 构建信息

            - 构建编号: #${{ github.run_number }}
            - 提交: `${{ github.sha }}`

          files: |
            release/AppOpt
            release/AppOpt-ebpf
            release/AppOpt-aarch64.tar.gz
            release/VERSION.txt

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
