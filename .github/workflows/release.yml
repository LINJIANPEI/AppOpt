name: Build AppOpt

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: bpfel-unknown-none

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install bpf-linker
        run: cargo install bpf-linker

      - name: Configure Cargo
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<EOF
          [target.bpfel-unknown-none]
          linker = "bpf-linker"
          EOF

      - name: Build AppOpt
        run: cargo build --release -p AppOpt

      - name: Build AppOpt-ebpf
        run: cargo build --release -p AppOpt-ebpf --target bpfel-unknown-none

      - name: Upload AppOpt
        uses: actions/upload-artifact@v4
        with:
          name: AppOpt
          path: target/release/AppOpt

      - name: Upload AppOpt-ebpf
        uses: actions/upload-artifact@v4
        with:
          name: AppOpt-ebpf
          path: target/bpfel-unknown-none/release/AppOpt-ebpf