name: 构建并发布 AppOpt

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  RUSTFLAGS: "-C panic=abort -C force-unwind-tables=no"

jobs:
  build-arm64:
    runs-on: ubuntu-22.04
    name: 构建 ARM64 版本
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2024-01-01  # 使用固定日期版本，更稳定
          targets: aarch64-unknown-linux-musl
          components: rust-src
      
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm libelf-dev \
            gcc-aarch64-linux-gnu musl-tools
      
      - name: 设置交叉编译环境
        run: |
          echo "CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "AR_aarch64_unknown_linux_musl=aarch64-linux-gnu-ar" >> $GITHUB_ENV
      
      - name: 编译 eBPF
        run: |
          cd AppOpt-ebpf
          cargo build --release --target bpfel-unknown-none \
            -Z build-std="core,alloc" \
            -Z build-std-features="panic_immediate_abort"
      
      - name: 编译主程序
        run: |
          cd AppOpt
          cargo build --release --target aarch64-unknown-linux-musl
      
      - name: 打包
        run: |
          mkdir -p release
          cp AppOpt/target/aarch64-unknown-linux-musl/release/AppOpt release/
          cp AppOpt-ebpf/target/bpfel-unknown-none/release/AppOpt-ebpf release/
          chmod +x release/*
          file release/*
      
      - name: 发布
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}