name: 构建并发布 AppOpt

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-22.04
    name: 构建 ARM64 版本
    
    steps:
      - name: 检出源代码
        uses: actions/checkout@v4
      
      # 使用 nightly Rust
      - name: 安装 Rust（nightly）
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-unknown-linux-musl
      
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            libelf-dev \
            gcc-aarch64-linux-gnu \
            musl-tools
      
      - name: 设置交叉编译环境变量
        run: |
          echo "CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "AR_aarch64_unknown_linux_musl=aarch64-linux-gnu-ar" >> $GITHUB_ENV
      
      - name: 编译 eBPF 程序（nightly + build-std）
        run: |
          cd AppOpt-ebpf
          cargo build --release --target aarch64-unknown-linux-musl \
            -Z build-std="core" \
            -Z build-std-features="panic_immediate_abort"
      
      - name: 编译主程序
        run: |
          cd AppOpt
          cargo build --release --target aarch64-unknown-linux-musl
      
      - name: 准备二进制文件
        run: |
          mkdir -p release
          cp AppOpt/target/aarch64-unknown-linux-musl/release/AppOpt release/
          cp AppOpt-ebpf/target/aarch64-unknown-linux-musl/release/AppOpt-ebpf release/
          chmod +x release/*
          
          echo "=== 二进制文件信息 ==="
          file release/*
          echo ""
          echo "=== 文件大小 ==="
          ls -lh release/*
      
      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/AppOpt
            release/AppOpt-ebpf
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: AppOpt-arm64
          path: release/