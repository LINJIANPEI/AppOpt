create-release:
  name: 创建发布版本
  runs-on: ubuntu-latest
  needs:
    - build-app
    - build-ebpf

  steps:
    - uses: actions/checkout@v4

    - name: 下载编译产物
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: 生成版本标签
      id: version
      run: |
        TIME=$(date -u '+%Y%m%d-%H%M%S')

        if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
          TAG="pre-${TIME}"
        else
          TAG="build-${TIME}"
        fi

        echo "tag_name=${TAG}" >> $GITHUB_OUTPUT

    - name: 准备发布文件
      run: |
        mkdir -p release

        cp artifacts/AppOpt/AppOpt release/AppOpt
        cp artifacts/AppOpt-ebpf/AppOpt-ebpf release/AppOpt-ebpf

        chmod +x release/*

    - name: 创建 GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag_name }}
        name: "AppOpt ${{ steps.version.outputs.tag_name }}"
        prerelease: ${{ github.event.inputs.prerelease }}

        body: |
          ## 🚀 AppOpt 自动构建版本

          ### 包含文件

          - AppOpt 用户程序
          - AppOpt eBPF 程序

          ### 构建信息

          - 构建编号: #${{ github.run_number }}
          - 提交: `${{ github.sha }}`

        files: |
          release/AppOpt
          release/AppOpt-ebpf

      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}