name: Build AppOpt ARM64 (CLEAN MODE)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ===================== Checkout（强制最新） =====================
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ===================== 安装编译环境（无缓存） =====================
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross

      # ===================== Clean build =====================
      - name: Build (clean)
        run: |
          rm -rf out
          mkdir -p out

          aarch64-linux-gnu-gcc \
            -O2 -pipe -static -pthread \
            AppOpt.c \
            -o out/AppOpt

      # ===================== strip =====================
      - name: Strip binary
        run: |
          aarch64-linux-gnu-strip out/AppOpt || true

      # ===================== 记录版本信息（非常重要） =====================
      - name: Write build info
        run: |
          echo "commit: $GITHUB_SHA" > out/build_info.txt
          echo "run: $GITHUB_RUN_NUMBER" >> out/build_info.txt
          echo "date: $(date)" >> out/build_info.txt

      # ===================== upload artifact =====================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppOpt-arm64
          path: out/

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: AppOpt-arm64
          path: out

      # ===================== Release =====================
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AppOpt CLEAN Build ${{ github.run_number }}
          files: |
            out/AppOpt
            out/build_info.txt