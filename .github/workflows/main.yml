name: Build AppOpt ARM64

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu

      - name: Build static ARM64 binary
        run: |
          mkdir -p out
          aarch64-linux-gnu-gcc \
            -O3 \
            -static \
            -pthread \
            AppOpt.c \
            -o out/AppOpt

      - name: Strip binary (optional reduce size)
        run: |
          aarch64-linux-gnu-strip out/AppOpt || true

      - name: Upload artifact (Actions下载用)
        uses: actions/upload-artifact@v4
        with:
          name: AppOpt-arm64
          path: out/AppOpt

      - name: Create Release (GitHub Releases下载用)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AppOpt Build ${{ github.run_number }}
          files: out/AppOpt