name: Build AppOpt ARM64

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ===================== 缓存 apt =====================
      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-arm64-${{ hashFiles('**/*.c') }}
          restore-keys: |
            ${{ runner.os }}-apt-arm64-

      # ===================== 安装工具链（修复glibc缺失） =====================
      - name: Install toolchain (fast + complete)
        run: |
          sudo apt update
          sudo apt install -y \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            binutils-aarch64-linux-gnu

      # ===================== 编译 =====================
      - name: Build (fast)
        run: |
          mkdir -p out
          aarch64-linux-gnu-gcc \
            -O2 -pipe -s -static -pthread \
            AppOpt.c \
            -o out/AppOpt

      # ===================== strip =====================
      - name: Strip
        run: |
          aarch64-linux-gnu-strip out/AppOpt || true

      # ===================== 上传产物 =====================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppOpt-arm64
          path: out/AppOpt

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: AppOpt-arm64
          path: out

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AppOpt Build ${{ github.run_number }}
          files: out/AppOpt