name: Build AppOpt ARM64

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ===================== APT 缓存 =====================
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt
            /var/lib/apt/lists
          key: apt-arm64-toolchain-${{ runner.os }}

      # ===================== Install toolchain =====================
      - name: Install toolchain (cached)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu

      # ===================== Build =====================
      - name: Build (fast)
        run: |
          mkdir -p out
          aarch64-linux-gnu-gcc \
            -O2 -pipe -s -static -pthread \
            AppOpt.c \
            -o out/AppOpt

      # ===================== Strip =====================
      - name: Strip
        run: |
          aarch64-linux-gnu-strip out/AppOpt || true

      # ===================== Artifact =====================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppOpt-arm64
          path: out/AppOpt

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: AppOpt-arm64
          path: out

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AppOpt Build ${{ github.run_number }}
          files: out/AppOpt