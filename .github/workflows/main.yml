name: Build AppOpt ARM64

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu

      - name: Build (fast)
        run: |
          mkdir -p out
          aarch64-linux-gnu-gcc \
            -O2 -pipe -s -static -pthread \
            AppOpt.c \
            -o out/AppOpt

      - name: Strip
        run: |
          aarch64-linux-gnu-strip out/AppOpt || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppOpt-arm64
          path: out/AppOpt

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: AppOpt-arm64
          path: out

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AppOpt Build ${{ github.run_number }}
          files: out/AppOpt