name: Build AppOpt ARM64 (CLEAN MODE)

on:
  workflow_dispatch:  # 只允许手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross

      - name: Clean build
        run: |
          rm -rf out
          mkdir -p out

          # 增加 -Wall -Wextra 以捕获潜在问题，-static -pthread 保持不变
          aarch64-linux-gnu-gcc \
            -O2 -pipe -static -pthread \
            -Wall -Wextra \
            AppOpt.c \
            -o out/AppOpt

      - name: Strip binary
        run: |
          aarch64-linux-gnu-strip out/AppOpt || true

      - name: Verify binary
        run: |
          file out/AppOpt
          ldd out/AppOpt || echo "静态链接，无动态依赖"

      - name: Write build info
        run: |
          echo "commit: $GITHUB_SHA" > out/build_info.txt
          echo "run: $GITHUB_RUN_NUMBER" >> out/build_info.txt
          echo "date: $(date)" >> out/build_info.txt
          echo "version: $(./out/AppOpt -v 2>&1 | head -1)" >> out/build_info.txt || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppOpt-arm64
          path: out/

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: AppOpt-arm64
          path: out

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AppOpt CLEAN Build ${{ github.run_number }}
          files: |
            out/AppOpt
            out/build_info.txt
